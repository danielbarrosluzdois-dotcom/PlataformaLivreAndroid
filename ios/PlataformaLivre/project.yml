name: PlataformaLivre
options:
  bundleIdPrefix: br.uerj.centrocultural
  deploymentTarget:
    iOS: "15.0"

targets:
  PlataformaLivre:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        type: folder
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.uerj.centrocultural.plataformalivre
        PRODUCT_NAME: PlataformaLivre
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 15.0
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
      gatherCoverageData: false
