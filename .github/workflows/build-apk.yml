name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: build-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename unsigned APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk Plataforma_Livre_v1.2_unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Plataforma-Livre-v1.2-Unsigned
          path: Plataforma_Livre_v1.2_unsigned.apk
          retention-days: 30
