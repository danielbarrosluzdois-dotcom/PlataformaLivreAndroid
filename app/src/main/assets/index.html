<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Plataforma Livre</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% 8%,#232323 0%,#111 35%,#050505 70%,#000 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.app{width:min(100%,440px);min-height:min(730px,calc(100vh - 24px));border:1px solid #2b2b2b;border-radius:26px;background:rgba(10,10,10,.94);box-shadow:0 25px 70px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 7px;font-size:13px;color:#bdbdbd}.instagram-btn{display:inline-flex;align-items:center;gap:7px;color:#d8d8d8;text-decoration:none;border:1px solid #2f2f2f;background:#111;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:600;-webkit-tap-highlight-color:transparent}.instagram-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}.live{display:inline-flex;align-items:center;gap:8px;letter-spacing:.12em;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.8)}.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 25px 8px;text-align:center}.logo-wrap{width:min(72vw,285px);aspect-ratio:1/1;border-radius:28px;overflow:hidden;border:1px solid #333;background:#000;box-shadow:0 18px 45px rgba(0,0,0,.45);margin-bottom:18px;display:flex;align-items:center;justify-content:center}.logo-wrap img{width:100%;height:100%;object-fit:contain;display:block}h1{margin:0 0 7px;font-size:clamp(25px,7vw,33px);font-weight:600;letter-spacing:-.03em}.tagline{margin:0;color:#bdbdbd;line-height:1.42;font-size:14px}.controls{padding:12px 22px 16px}.play{width:100%;height:50px;border:0;border-radius:16px;background:#fff;color:#000;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;-webkit-tap-highlight-color:transparent}.play:active{transform:scale(.99)}.status{text-align:center;min-height:20px;margin:8px 0 5px;color:#cfcfcf;font-size:12px}.volume-row{display:flex;align-items:center;gap:10px;margin-top:8px;color:#a8a8a8}input[type=range]{width:100%;accent-color:#fff}.hint{margin-top:10px;text-align:center;color:#909090;font-size:12px;line-height:1.4;font-weight:600}.footer{border-top:1px solid #1f1f1f;padding:9px 12px 12px}.footer img{width:100%;max-width:395px;height:auto;display:block;margin:0 auto}.footer-frame{background:#000;border-radius:10px;padding:4px 5px}@media(max-height:700px){.app{min-height:auto}.logo-wrap{width:min(48vh,240px);margin-bottom:12px}.hero{padding-top:4px}.controls{padding-top:8px}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <a class="instagram-btn" href="https://www.instagram.com/coartuerj/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram da COART UERJ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg>
      <span>@coartuerj</span>
    </a>
    <span class="live"><span class="dot"></span> AO VIVO</span>
  </div>
  <section class="hero">
    <div class="logo-wrap"><img src="logo.svg" alt="Logo Plataforma Livre"></div>
    <h1>Plataforma Livre</h1>
    <p class="tagline">Onde os ritmos na Uerj se encontram.</p>
  </section>
  <section class="controls">
    <button id="playBtn" class="play" type="button"><span id="playIcon">&#9654;</span><span id="playText">OUVIR AO VIVO</span></button>
    <div id="status" class="status">Toque no botão para iniciar a transmissão.</div>
    <div class="volume-row"><span>&#128264;</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume"><span>&#128266;</span></div>
    <div class="hint">Centro Cultural UERJ</div>
  </section>
  <div class="footer"><div class="footer-frame"><img src="footer.svg" alt="Logos institucionais UERJ, PR3, Decult UERJ e COART"></div></div>
</main>
<audio id="radio" preload="none" playsinline src="https://servidor37-2.brlogic.com:7144/live"></audio>
<script>
(()=>{const radio=document.getElementById('radio'),btn=document.getElementById('playBtn'),icon=document.getElementById('playIcon'),txt=document.getElementById('playText'),status=document.getElementById('status'),volume=document.getElementById('volume');radio.volume=Number(volume.value);function ui(p){icon.textContent=p?'❚❚':'▶';txt.textContent=p?'PAUSAR TRANSMISSÃO':'OUVIR AO VIVO'}async function play(){status.textContent='Conectando ao Plataforma Livre...';try{await radio.play();ui(true);status.textContent='Você está ouvindo o Plataforma Livre ao vivo.'}catch(e){ui(false);status.textContent='Não foi possível iniciar. Toque novamente.'}}function pause(){radio.pause();ui(false);status.textContent='Transmissão pausada.'}btn.addEventListener('click',()=>radio.paused?play():pause());volume.addEventListener('input',()=>radio.volume=Number(volume.value));radio.addEventListener('playing',()=>{ui(true);status.textContent='Você está ouvindo o Plataforma Livre ao vivo.'});radio.addEventListener('waiting',()=>status.textContent='Carregando transmissão...');radio.addEventListener('stalled',()=>status.textContent='A conexão está lenta. Tentando continuar...');radio.addEventListener('error',()=>{ui(false);status.textContent='Não foi possível conectar à transmissão. Tente novamente.'});})();
</script>
</body></html>
